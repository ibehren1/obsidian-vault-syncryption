<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Vault Syncryption</title>
  <!-- Palette
       Tile    #2d2f31  (dashboard.internal.behrenshome.com body background)
       Steel   #f4f5f6 / #e8eaed / #c3c6ca / #8e9195
       Red     #C8102E -> #B3101F -> #8E0C1B  (candy-apple / crimson midpoint, hue ~354)
       Detail  #4a4c4e (site divider), #3a3c3e (site card)
       Red only ever sits on steel: on the charcoal it would be < 2:1 contrast. -->
  <defs>
    <!-- Outer rim: lit from above -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f6"/>
      <stop offset="1" stop-color="#8e9195"/>
    </linearGradient>
    <!-- Door face: inverted gradient so it reads as recessed into the rim -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3c6ca"/>
      <stop offset="1" stop-color="#e8eaed"/>
    </linearGradient>
    <!-- Lacquered red: single filled shapes, so the gradient is seamless across arc + head -->
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8102E"/>
      <stop offset="0.5" stop-color="#B3101F"/>
      <stop offset="1" stop-color="#8E0C1B"/>
    </linearGradient>
    <!-- Hub: matte dark steel -->
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3c3e"/>
      <stop offset="1" stop-color="#2d2f31"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="#2d2f31"/>

  <!-- Soft contact shadow under the door -->
  <circle cx="256" cy="264" r="200" fill="#000" opacity="0.45" filter="url(#shadow)"/>

  <!-- Door rim -->
  <circle cx="256" cy="256" r="200" fill="url(#rim)"/>
  <!-- Locking bolt slots, offset 22.5deg so none sit in the arrow gaps -->
  <g fill="#4a4c4e">
    <rect x="251" y="61" width="10" height="18" rx="2" transform="rotate(22.5 256 256)"/>
    <rect x="251" y="61" width="10" height="18" rx="2" transform="rotate(67.5 256 256)"/>
    <rect x="251" y="61" width="10" height="18" rx="2" transform="rotate(112.5 256 256)"/>
    <rect x="251" y="61" width="10" height="18" rx="2" transform="rotate(157.5 256 256)"/>
    <rect x="251" y="61" width="10" height="18" rx="2" transform="rotate(202.5 256 256)"/>
    <rect x="251" y="61" width="10" height="18" rx="2" transform="rotate(247.5 256 256)"/>
    <rect x="251" y="61" width="10" height="18" rx="2" transform="rotate(292.5 256 256)"/>
    <rect x="251" y="61" width="10" height="18" rx="2" transform="rotate(337.5 256 256)"/>
  </g>

  <!-- Recessed door face with machined edge -->
  <circle cx="256" cy="256" r="172" fill="url(#face)" stroke="#6b6e72" stroke-width="3"/>

  <!-- Sync arrows: precise annular segments with sharp arrowheads (clockwise) -->
  <g fill="url(#red)">
    <path d="M126.3,208.8 A138,138 0 0 1 351.9,156.7 L361.6,146.7 L375.8,217.1 L325.5,184.1 L335.2,174.0 A114,114 0 0 0 148.9,217.0 Z"/>
    <path d="M385.7,303.2 A138,138 0 0 1 160.1,355.3 L150.4,365.3 L136.2,294.9 L186.5,327.9 L176.8,338.0 A114,114 0 0 0 363.1,295.0 Z"/>
  </g>

  <!-- Center hub -->
  <circle cx="256" cy="256" r="68" fill="url(#hub)" stroke="#8e9195" stroke-width="3"/>
  <!-- Keyhole: steel, cut cleanly into the hub -->
  <g fill="#e8eaed">
    <circle cx="256" cy="248" r="13"/>
    <polygon points="250,254 262,254 268,284 244,284"/>
  </g>
</svg>
