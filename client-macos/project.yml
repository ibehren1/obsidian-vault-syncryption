# XcodeGen spec for the app (and later the FSKit extension). Generate with `xcodegen` in
# client-macos/; the .xcodeproj is not checked in.
name: VaultSyncryptionClient
options:
  bundleIdPrefix: com.behrenshome.syncryption
  deploymentTarget:
    macOS: "26.0"
packages:
  SyncryptionClient:
    path: .
settings:
  base:
    MARKETING_VERSION: "0.1.34"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
  configs:
    # No get-task-allow in Release: no debugger attaching to the process that holds the keys.
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  VaultSyncryptionClient:
    type: application
    platform: macOS
    sources:
      - Sources/SyncryptionApp
      - App/Assets.xcassets
    dependencies:
      - target: SyncryptionFinder
      - package: SyncryptionClient
        product: SyncryptionAPI
      - package: SyncryptionClient
        product: SyncryptionAppCore
      - package: SyncryptionClient
        product: SyncryptionCrypto
      - package: SyncryptionClient
        product: SyncryptionSync
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Vault Syncryption Client
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.behrenshome.syncryption.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
  SyncryptionFinder:
    type: app-extension
    platform: macOS
    sources:
      - SyncryptionFinder/FinderSyncExtension.swift
      - App/Assets.xcassets
    info:
      path: SyncryptionFinder/Info.plist
      properties:
        CFBundleDisplayName: Vault Syncryption Client
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        NSExtension:
          NSExtensionAttributes: {}
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSyncExtension
    entitlements:
      path: SyncryptionFinder/SyncryptionFinder.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Read vaults.json, nothing else: the extension never touches the synced files.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/Vault Syncryption/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.behrenshome.syncryption.mac.FinderSync
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
